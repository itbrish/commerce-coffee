
version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: coffee_postgres
    restart: always
    environment:
      POSTGRES_USER: coffee_admin
      POSTGRES_PASSWORD: coffee_secret_password
      POSTGRES_DB: coffee_commerce
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: coffee_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: coffee_api
    restart: always
    depends_on:
      - postgres
      - redis
    environment:
      PORT: 4000
      DATABASE_URL: "postgresql://coffee_admin:coffee_secret_password@postgres:5432/coffee_commerce?schema=public"
      REDIS_URL: "redis://redis:6379"
      JWT_SECRET: "atelier-du-cafe-super-secure-jwt-key-2026-production"
    ports:
      - "4000:4000"

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: coffee_storefront
    restart: always
    depends_on:
      - api
    environment:
      NEXT_PUBLIC_API_URL: "http://api:4000/api/v1"
    ports:
      - "3000:3000"

  admin:
    build:
      context: .
      dockerfile: apps/admin/Dockerfile
    container_name: coffee_admin
    restart: always
    depends_on:
      - api
    environment:
      NEXT_PUBLIC_API_URL: "http://api:4000/api/v1"
    ports:
      - "3001:3001"

volumes:
  postgres_data:
  redis_data:
