version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: atelier_postgres
    restart: always
    environment:
      POSTGRES_USER: atelier_admin
      POSTGRES_PASSWORD: atelier_secure_password_2026
      POSTGRES_DB: atelier_commerce
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: atelier_redis
    restart: always
    ports:
      - "6379:6379"

  api:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    container_name: atelier_api
    restart: always
    ports:
      - "4000:4000"
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgresql://atelier_admin:atelier_secure_password_2026@postgres:5432/atelier_commerce?schema=public
      REDIS_URL: redis://redis:6379
      JWT_SECRET: atelier-du-cafe-production-jwt-secret-key-2026
      NEXT_PUBLIC_STORE_URL: https://ateliercoffee.co
      NEXT_PUBLIC_ADMIN_URL: https://admin.ateliercoffee.co
      NEXT_PUBLIC_WHATSAPP_NUMBER: "6281234567890"
      WHATSAPP_PROVIDER: meta
      PAYMENT_PROVIDER: midtrans
    depends_on:
      - postgres
      - redis

volumes:
  pgdata: